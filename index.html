<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eurolux Quotes</title>
<meta name="description" content="Eurolux Doors and Windows quotation system">
<meta name="theme-color" content="#2e2e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Eurolux Quotes">
<style>
/* ============================================================
   EUROLUX QUOTES — app styles
   ============================================================ */
:root{
  --ink:#1f1f1f; --ink-2:#555; --ink-3:#8a8a8a; --line:#e4e2dd; --line-2:#d3d0c9;
  --bg:#f3f2ef; --card:#fff; --dark:#2e2e2e; --dark-2:#3a3a3a;
  --accent:#9c7b45; --accent-2:#7f6335; --accent-bg:#f6f0e4;
  --ok:#2f7d4f; --ok-bg:#e7f4ec; --warn:#b3261e; --warn-bg:#fdecea; --amber:#8a5a00; --amber-bg:#fff4d6;
  --blue:#285a8c; --blue-bg:#e6eef7;
  --r:10px; --font:"Century Gothic","Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.muted{color:var(--ink-3)} .small{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.hidden{display:none!important}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand img{height:30px;filter:invert(1);mix-blend-mode:screen}
.brand span{font-size:12px;letter-spacing:.18em;color:#cfc6b6;border-left:1px solid #555;padding-left:10px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:#cfcfcf;font-size:13px;letter-spacing:.02em}
.nav a:hover{background:#3d3d3d;color:#fff}
.nav a.on{background:#474747;color:#fff}
.appbar .spacer{flex:1}
.userpick{display:flex;align-items:center;gap:8px;font-size:12px;color:#bbb}
.userpick select{background:#3d3d3d;border:1px solid #555;color:#fff;border-radius:8px;padding:6px 8px;max-width:160px}

/* ---------- Layout ---------- */
.page{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:22px;letter-spacing:.01em}
.page-h .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;letter-spacing:.02em}
.card-h .hint{font-size:12px;color:var(--ink-3)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2} .span3{grid-column:span 3} .spanall{grid-column:1/-1}

/* ---------- Form controls ---------- */
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field .help{font-size:11.5px;color:var(--ink-3);margin-top:4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],select,textarea{
  width:100%;background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(156,123,69,.15)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input[type=number]{font-variant-numeric:tabular-nums}
input.sm,select.sm{padding:6px 8px;font-size:13px}
.inline-input{border:1px solid transparent!important;background:transparent!important;padding:5px 6px!important}
.inline-input:hover{border-color:var(--line-2)!important;background:#fff!important}
.inline-input:focus{border-color:var(--accent)!important;background:#fff!important}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.field label.check{display:flex;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--ink);margin:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f7f6f3;border-color:#c4c0b7}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{background:#111}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.danger{color:var(--warn)}
.btn.danger:hover{background:var(--warn-bg);border-color:#f0c4c0}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:5px 7px;min-width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Pills ---------- */
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:#eee;color:#555;white-space:nowrap}
.pill.Draft{background:#eeece8;color:#5b5750} .pill.Sent{background:var(--blue-bg);color:var(--blue)}
.pill.Won{background:var(--ok-bg);color:var(--ok)} .pill.Lost{background:var(--warn-bg);color:var(--warn)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}

/* ---------- Quotes list ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.qlist{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qrow{display:grid;grid-template-columns:120px minmax(0,1fr) 120px 100px 100px 140px 200px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.qrow:first-child{border-top:none}
.qrow.head{background:#faf9f7;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 16px}
.qrow:not(.head):hover{background:#fbfaf8}
.qrow .num{font-weight:700}
.qrow .proj{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .cli{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.qrow .acts{display:flex;gap:2px;justify-content:flex-end;flex-wrap:nowrap;min-width:0;overflow:hidden}
.qrow .acts .btn{padding:5px 8px}
@media (max-width:1180px) and (min-width:821px){.qrow{grid-template-columns:120px minmax(0,1fr) 100px 100px 140px 200px}.qrow .c-user{display:none}}
.empty{padding:50px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.side{position:sticky;top:76px}
.side .card{padding:16px}
.tot-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.tot-line.sub{color:var(--ink-2)}
.tot-line.big{font-size:17px;font-weight:700;border-top:2px solid var(--dark);margin-top:6px;padding-top:10px}
.tot-line.neg span:last-child{color:var(--warn)}
.internal{background:#faf8f3;border:1px dashed #d9ceb8;border-radius:8px;padding:10px 12px;margin-top:12px}
.internal .t{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--dark);color:#fff}
.markup-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.disc-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:end}

.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fff}
.sec-h{display:flex;align-items:center;gap:8px;background:#f7f6f3;border-bottom:1px solid var(--line);padding:6px 8px 6px 12px}
.sec-h input{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;max-width:320px}
.sec-h .meta{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.item{display:grid;grid-template-columns:26px 80px minmax(0,1fr) 92px 34px 84px 96px 112px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item.head{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:7px 12px;background:#fcfcfb}
.item .n{width:24px;height:24px;border-radius:6px;background:var(--dark-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.item .marks{font-weight:700;font-size:12.5px;word-break:break-word}
.item .desc b{font-weight:600}
.item .desc .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.item .desc .sub i{font-style:normal;color:var(--accent-2)}
.item .size,.item .qty{font-size:12.5px;font-variant-numeric:tabular-nums}
.item .qty{text-align:center;font-weight:700}
.item .money{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.item .money.total{font-weight:700}
.item .acts{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.item .acts .btn.icon{min-width:26px;padding:4px 5px}
.item .mv{display:flex;flex-direction:column}
.item .mv .btn{padding:0 5px;min-width:22px;line-height:1.1;font-size:11px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.ovr{background:var(--blue-bg);color:var(--blue)} .tag.zero{background:var(--amber-bg);color:var(--amber)}
.sec-foot{padding:8px 12px;border-top:1px solid var(--line);background:#fcfcfb}
.addsec{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addsec select,.addsec input{max-width:240px}

.ex-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 120px 120px 36px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ex-row.head{border-top:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ex-row .money{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{font-size:15px}
details.card>summary::after{content:"＋";color:var(--ink-3);font-size:16px}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:14px}
.spec-row{display:grid;grid-template-columns:170px minmax(0,1fr) 36px;gap:8px;margin-bottom:6px}

/* ---------- Products ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:#faf9f7}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.cat td{background:#f3f1ec;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
table.t tr.off td:not(.keep){opacity:.45}
table.t td.money,table.t th.money{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.band-row{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:8px;margin-bottom:6px;align-items:center}

/* ---------- Settings ---------- */
.img-drop{display:flex;align-items:center;gap:14px}
.img-drop .prev{width:150px;height:70px;border:1px dashed var(--line-2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
.img-drop .prev img{max-width:100%;max-height:100%}
.user-row{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:8px;margin-bottom:8px}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#faf9f7;border-radius:0 0 14px 14px;flex-wrap:wrap}
.calc{background:#f7f5f0;border:1px solid #e8e1d2;border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.calc .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.calc .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.calc .note{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn)}
.banner{background:var(--amber-bg);border:1px solid #f0dca8;color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}

/* ---------- Preview toolbar ---------- */
.pv-bar{position:sticky;top:58px;z-index:20;background:rgba(243,242,239,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pv-bar .spacer{flex:1}
.pv-wrap{padding:24px 12px 60px;overflow-x:auto}

/* ============================================================
   QUOTATION DOCUMENT (screen preview + print)
   ============================================================ */
.doc{font-family:var(--font);color:#222;font-size:10.5px;line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .pg{background:#fff;width:210mm;min-height:297mm;margin:0 auto 24px;padding:12mm 12mm 22mm;box-shadow:0 2px 16px rgba(0,0,0,.13);position:relative}
.doc .screen-foot{position:absolute;left:12mm;right:12mm;bottom:8mm}
.doc .print-foot{display:none}
.doc .foot{display:flex;font-size:8.5px;height:6mm;align-items:stretch}
.doc .foot .a{background:#3a3a3a;color:#fff;padding:0 5mm;display:flex;align-items:center;font-size:10px;letter-spacing:.02em;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);padding-right:9mm}
.doc .foot .b{flex:1;background:#d9d9d9;color:#333;display:flex;align-items:center;justify-content:flex-end;padding:0 4mm}
/* cover */
.doc .cover-img{width:100%;height:auto;max-height:90mm;object-fit:cover;display:block}
.doc .cover-title{display:flex;justify-content:space-between;align-items:flex-end;margin:16mm 2mm 0}
.doc .cover-title .big{font-size:30px;font-weight:700;letter-spacing:.38em}
.doc .cover-title .qn{text-align:right;font-size:12px}
.doc .cover-title .qn b{font-size:17px}
.doc .cover-meta{text-align:center;margin-top:18mm}
.doc .cover-meta .lbl{letter-spacing:.3em;font-size:11px;color:#444}
.doc .cover-meta .val{font-size:17px;font-weight:700;margin:2mm 0 12mm}
.doc .letter{margin:4mm 2mm 0;font-size:11px;line-height:1.65}
.doc .letter p{text-indent:2.2em;margin:3mm 0 10mm}
.doc .letter .sig{margin-top:8mm}
/* header block */
.doc .doc-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:3mm}
.doc .doc-head img{height:17mm}
.doc .doc-head .t1{font-size:25px;font-weight:800;text-align:right;line-height:1;letter-spacing:.01em}
.doc .doc-head .t2{font-size:10.5px;letter-spacing:.28em;text-align:right;margin-top:1.5mm}
.doc .doc-meta{display:grid;grid-template-columns:1fr auto;gap:.8mm 12mm;font-size:10px;border-top:1px solid #bdbdbd;padding:3mm 1mm 4mm}
.doc .doc-meta .kv{display:grid;grid-template-columns:17mm 1fr;gap:2mm}
.doc .doc-meta .kv.r{grid-template-columns:21mm auto}
.doc .doc-meta b{font-weight:700}
/* BOQ table */
.doc table.boq{width:100%;border-collapse:collapse;font-size:9.3px}
.doc table.boq td,.doc table.boq th{border:1px solid #cfcfcf;padding:2.2mm 1.6mm;vertical-align:middle}
.doc table.boq tr.hd td{border:none;padding:0}
.doc table.boq tr.colh th{background:#3a3a3a;color:#fff;font-weight:700;text-align:center;font-size:8.8px;letter-spacing:.02em;border-color:#555}
.doc table.boq tr.title td{background:#3a3a3a;color:#fff;text-align:center;font-weight:700;letter-spacing:.06em;font-size:10px;border-color:#555}
.doc table.boq tr.secrow td{background:#8f8f8f;color:#fff;text-align:center;font-weight:700;font-size:8.5px;letter-spacing:.06em;padding:1.1mm;border-color:#8f8f8f}
.doc table.boq td.no{background:#3a3a3a;color:#fff;text-align:center;font-weight:700;border-color:#555}
.doc table.boq td.ref{text-align:center;font-weight:700;font-size:8.3px}
.doc table.boq td.c{text-align:center}
.doc table.boq td.m{text-align:right;white-space:nowrap}
.doc table.boq .loc{font-weight:700;font-style:italic;font-size:8.6px}
.doc table.boq .note{font-weight:700;font-style:italic;font-size:8.6px}
.doc table.boq .gl{font-size:8.6px;color:#444}
.doc table.boq tr.tot td{font-weight:700}
.doc table.boq tr.tot td.lbl{text-align:right;padding-right:3mm}
.doc table.boq tr.tot.grand td{font-size:11.5px}
.doc table.boq tr.tot.grand td.m{background:#f0f0f0}
.doc table.boq tr.tot td.blank{border:none}
.doc table.boq tbody tr{break-inside:avoid;page-break-inside:avoid}
.doc table.boq tfoot td{border:none;padding:0}
.doc table.boq tfoot .fs{height:9mm}
/* terms */
.doc .bar{display:flex;align-items:center;margin:9mm 0 5mm}
.doc .bar span{background:#3a3a3a;color:#fff;letter-spacing:.3em;font-weight:700;padding:2.6mm 6mm;font-size:10px}
.doc .bar i{flex:1;height:2.4mm;background:#3a3a3a}
.doc .excl{font-size:10.5px;line-height:1.7;margin-left:4mm}
.doc .spec{display:grid;grid-template-columns:34mm 1fr;gap:.6mm 3mm;font-size:10.5px;margin-left:4mm}
.doc .spec b{text-decoration:underline}
.doc .confirm{font-size:10.5px;line-height:1.7;text-indent:2.2em;margin:0 2mm}
.doc .signs{margin:12mm 2mm 0;display:grid;gap:10mm;font-size:10.5px}
.doc .signs div{display:grid;grid-template-columns:22mm 70mm;align-items:end}
.doc .signs div span{border-bottom:1px solid #999;height:5mm}


/* ---------- revisions, variations ---------- */
fieldset.fs{border:none;margin:0;padding:0;min-width:0}
fieldset.fs[disabled] .item .acts,fieldset.fs[disabled] .sec-foot,fieldset.fs[disabled] .addsec{display:none}
.banner.lock{background:#eef0f3;border-color:#d6dbe2;color:#394656}
.banner.info{background:var(--blue-bg);border-color:#c9d9ec;color:var(--blue)}
.banner a{color:inherit;font-weight:700}
.tag.vo{background:#efe7f7;color:#6b3fa0} .tag.rev{background:var(--accent-bg);color:var(--accent-2)}
.pill.Approved{background:var(--ok-bg);color:var(--ok)} .pill.Revised{background:#eef0f3;color:#6b7684}
.hlist{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.hrow{display:grid;grid-template-columns:130px 1fr 90px 130px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-decoration:none}
.hrow:first-child{border-top:none} .hrow:hover{background:#faf9f7} .hrow.on{background:var(--accent-bg)}
.hrow .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.changes{margin-top:12px;background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.changes ul{margin:8px 0 0;padding-left:18px} .changes li{margin:3px 0}
.changes .pos{color:var(--ok);font-weight:700} .changes .neg{color:var(--warn);font-weight:700}
.chg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px}
.chg.add{background:var(--ok-bg);color:var(--ok)} .chg.rem{background:var(--warn-bg);color:var(--warn)} .chg.mod{background:var(--amber-bg);color:var(--amber)}
.contract{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:10px;padding:10px 12px;background:#f7f5f0;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums}
.doc table.boq td.ref .rv{display:inline-block;margin-top:1mm;background:#3a3a3a;color:#fff;font-size:6.5px;padding:.3mm 1.2mm;border-radius:1mm;letter-spacing:.05em}
/* ---------- new quote chooser & import ---------- */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line-2);border-radius:12px;padding:18px;background:#fff;cursor:pointer;font:inherit;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent);background:var(--accent-bg)}
.choice .ic{font-size:22px;width:40px;height:40px;border-radius:10px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center}
.choice b{font-size:15px} .choice span:last-child{font-size:12.5px;color:var(--ink-2)}
.reading{display:flex;gap:14px;align-items:center;padding:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.imp{padding-bottom:110px}
.imp-row{display:grid;grid-template-columns:28px 110px minmax(0,1.3fr) minmax(0,1.5fr) 70px 80px 80px 64px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.imp-row.head{border-top:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.imp-row.off>div:not(:first-child){opacity:.4}
.imp-row .src{font-size:12.5px;min-width:0} .imp-row .src>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .flag{font-size:11.5px;color:var(--amber);margin-top:2px}
.imp-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.imp-sec{margin-top:14px;padding:6px 10px;background:#f3f1ec;border-radius:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-sec .lbl{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.imp-sec input{max-width:360px;font-weight:700}
.imp-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;align-items:center;gap:16px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.lvl{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lvl-h{display:flex;justify-content:space-between;margin-bottom:6px}
.lvl-row{display:grid;grid-template-columns:62px minmax(0,1fr) 110px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.lvl-n{font-weight:700;color:var(--ink-2)} .lvl-marks{color:var(--ink-2)}
.map-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.map-row:first-of-type{border-top:none}
@media (max-width:820px){
  .choose{grid-template-columns:1fr}
  .hrow{grid-template-columns:1fr auto} .hrow .small{display:none}
  .imp-row{grid-template-columns:28px repeat(4,minmax(0,1fr));gap:6px}
  .imp-row.head{display:none}
  .imp-row>div:nth-child(1){grid-column:1}
  .imp-row>div:nth-child(2),.imp-row>div:nth-child(3),.imp-row>div:nth-child(4){grid-column:2/-1}
  .imp-row>div:nth-child(5){grid-column:2} .imp-row>div:nth-child(6){grid-column:3} .imp-row>div:nth-child(7){grid-column:4} .imp-row>div:nth-child(8){grid-column:5}
  .map-row{grid-template-columns:1fr}
  .lvl-grid{grid-template-columns:1fr}
}
/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1100px){
  .editor{grid-template-columns:1fr}
  .side{position:static}
  .item{grid-template-columns:26px 80px minmax(0,1fr) 92px 34px 96px 112px;}
  .item .rate-col{display:none}
}
@media (max-width:820px){
  .appbar{gap:8px;padding:0 12px}
  .brand span{display:none}
  .nav{margin-left:0}
  .nav a{padding:8px 9px}
  .userpick label{display:none}
  .page{padding:16px 12px 80px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .qrow.head{display:none}
  .qrow .c-user,.qrow .c-date{display:none}
  .qrow .num{grid-column:1}
  .qrow .c-status{grid-column:2;grid-row:1;text-align:right}
  .qrow .c-proj{grid-column:1}
  .qrow .amt{grid-column:2;grid-row:2}
  .qrow .acts{grid-column:1/-1;justify-content:flex-start}
  .item.head{display:none}
  .item{grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px}
  .item .marks{grid-column:2}
  .item .desc{grid-column:2/-1}
  .item .size{grid-column:2}
  .item .qty{grid-column:3;grid-row:3;text-align:right}
  .item .qty::before{content:"Qty "; font-weight:400;color:var(--ink-3)}
  .item .money.total{grid-column:2/-1}
  .item .money:not(.total){display:none}
  .item .acts{grid-column:1/-1;justify-content:flex-start}
  .ex-row{grid-template-columns:minmax(0,1fr) 70px 90px 36px}
  .ex-row .c-unit,.ex-row .money{display:none}
  .ex-row.head .c-rate{display:none}
  .calc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spec-row{grid-template-columns:1fr 36px}
  .spec-row input:nth-child(2){grid-column:1}
  .user-row{grid-template-columns:1fr 36px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100%}
  .modal-f{border-radius:0}
}
@media (max-width:520px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2,.span3{grid-column:auto}
  .nav a{font-size:12px;padding:7px 7px}
  .brand img{height:24px}
}

/* ============================================================
   PRINT
   ============================================================ */
@page{size:A4;margin:10mm 10mm 12mm}
@media print{
  html,body{background:#fff!important}
  .appbar,.pv-bar,.overlay,.toast{display:none!important}
  .pv-wrap{padding:0!important;overflow:visible!important}
  .doc .pg{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;break-after:page;page-break-after:always}
  .doc .pg:last-of-type{break-after:auto;page-break-after:auto}
  .doc .screen-foot{display:none}
  .doc .print-foot{display:block;position:fixed;left:0;right:0;bottom:0}
}
</style>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = n => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
const fmtQ = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const clone = o => JSON.parse(JSON.stringify(o));
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function dateLong(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
function dateShort(iso) {
  if (!iso) return ''; const d = new Date(iso + 'T00:00:00');
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'][d.getMonth()];
  return `${d.getDate()} ${m} ${d.getFullYear()}`;
}

    if (num(o.width) !== num(it.width) || num(o.height) !== num(it.height)) d.push(`size ${o.width}×${o.height} → ${it.width}×${it.height}`);

/* ============================================================
   PRICING ENGINE
   ============================================================ */
function baseRateFor(p, width) {
  for (const b of (p.bands || [])) {
    const lo = b.min === '' || b.min == null ? 0 : num(b.min);
    const hi = b.max === '' || b.max == null ? Infinity : num(b.max);
    if (width >= lo && width <= hi) return num(b.rate);
  }
  return num(p.rate);
}
function measureFor(p, it) {
  const w = num(it.width), h = num(it.height), min = num(p.minQty);
  if (p.unit === 'sqm') return Math.max(w * h / 1e6, min);
  if (p.unit === 'lm') return Math.max(w / 1000, min);
  return 1;
}
function priceItem(q, it) {
  const p = productById(it.productId) || { id: null, name: it.desc || '(product deleted)', unit: 'unit', rate: 0, bands: [], minQty: 0 };
  const g = glassById(it.glassId);
  const mk = 1 + num(q.markupPct) / 100;
  const qty = Math.max(0, num(it.qty));
  const w = num(it.width), h = num(it.height);
  const measure = measureFor(p, it);
  const base = baseRateFor(p, w);
  const glassArea = (w && h) ? (p.unit === 'sqm' ? measure : w * h / 1e6) : 0;
  const glassCost = g ? num(g.rate) : 0;
  const sellRate = r2(base * mk);                           // sell rate per m² / lm / each
  const glassSellRate = r2(glassCost * mk);
  const computedUnit = r2(measure * sellRate) + r2(glassArea * glassSellRate);
  const overridden = it.rateOverride !== '' && it.rateOverride != null && isFinite(parseFloat(it.rateOverride));
  const unit = overridden ? r2(num(it.rateOverride)) : r2(computedUnit);
  const unitCost = measure * base + glassArea * glassCost;
  return {
    p, g, measure, base, sellRate, glassArea, glassSellRate, computedUnit: r2(computedUnit), unit, overridden,
    total: r2(unit * qty), cost: r2(unitCost * qty), area: (w * h / 1e6) * qty,
    zero: !overridden && base === 0,
    glassUpgrade: !!(g && num(g.rate) > 0) || !!(g && g.id !== 'g-std' && g.id),
  };
}
function extraQty(q, x) {
  if (x.unit === 'area') return r2(q.items.reduce((s, it) => { const p = productById(it.productId); return s + (p && p.unit === 'sqm' ? num(it.width) * num(it.height) / 1e6 * num(it.qty) : 0); }, 0));
  if (x.unit === 'item') return q.items.reduce((s, it) => s + num(it.qty), 0);
  return num(x.qty);
}
function totals(q) {
  let items = 0, cost = 0, area = 0, count = 0, zero = 0;
  const lines = q.items.map(it => { const r = priceItem(q, it); items += r.total; cost += r.cost; area += r.area; count += num(it.qty); if (r.zero) zero++; return r; });
  let extras = 0;
  q.extras.forEach(x => { extras += r2((x.auto ? extraQty(q, x) : num(x.qty)) * num(x.rate)); });
  items = r2(items); extras = r2(extras);
  const subtotal = r2(items + extras);
  const discBase = q.discountOnExtras ? subtotal : items;
  let discount = q.discountType === '%' ? r2(discBase * num(q.discountValue) / 100) : r2(num(q.discountValue));
  discount = Math.min(Math.max(discount, 0), discBase);
  const net = r2(subtotal - discount);
  const vat = r2(net * num(S.settings.vatPct) / 100);
  const grand = r2(net + vat);
  const markupAmt = r2(items - cost);
  const profit = r2(net - extras - cost);          // profit on products after discount (extras treated as pass-through)
  return { lines, items, extras, subtotal, discount, net, vat, grand, cost: r2(cost), area, count, zero, markupAmt, profit, margin: net - extras > 0 ? profit / (net - extras) * 100 : 0 };
}
function orderedSections(q) {
  const secs = q.sections.slice();
  q.items.forEach(it => { if (it.section == null) it.section = ''; if (!secs.includes(it.section)) secs.push(it.section); });
  const hasBlank = q.items.some(i => !i.section);

function renderQuoteRows(all) {

function headTitle(q) {

}
function renderHistory() {
  const q = EQ; const box = $('#history-block'); if (!box) return;
  const fam = familyOf(q); const vos = q.type === 'quote' ? variationsOf(q) : [];
  const prev = prevRevOf(q); const d = diffQuotes(prev, q);
  if (fam.length < 2 && !vos.length && q.type !== 'variation') { box.innerHTML = ''; return; }
  const row = x => { const t = totals(x); return `<a class="hrow ${x.id === q.id ? 'on' : ''}" href="#/quote/${esc(x.id)}">
      <b>${esc(displayNo(x))}</b><span class="small muted">${esc(dateShort(x.date))} · ${esc(userById(x.preparedBy)?.name || '')}</span>
      <span class="pill ${esc(x.status)}">${esc(x.status)}</span><span class="amt">${fmt(t.grand)}</span></a>`; };
  let html = `<div class="card"><div class="card-h"><h2>${q.type === 'variation' ? 'Variation history' : 'Revisions & variations'}</h2></div>`;
  if (fam.length > 1) html += `<div class="hlist">${fam.slice().reverse().map(row).join('')}</div>`;
  if (prev) {
    const lines = [
      ...d.added.map(it => `<li><span class="chg add">Added</span> ${esc(itemLabel(it))} × ${esc(it.qty)}</li>`),
      ...d.removed.map(it => `<li><span class="chg rem">Removed</span> ${esc(itemLabel(it))} × ${esc(it.qty)}</li>`),
      ...d.changed.map(c => `<li><span class="chg mod">Changed</span> ${esc(itemLabel(c.it))}: ${esc(c.d.join(', '))}</li>`),
      ...d.other.map(o => `<li><span class="chg mod">Changed</span> ${esc(o)}</li>`),
    ];
    const diff = totals(q).grand - totals(prev).grand;
    html += `<div class="changes"><div class="row" style="justify-content:space-between"><b>Changes since ${esc(displayNo(prev))}</b>
      <span class="${diff < 0 ? 'neg' : 'pos'}">${diff >= 0 ? '+' : '−'} AED ${fmt(Math.abs(diff))} inc. VAT</span></div>
      ${lines.length ? `<ul>${lines.join('')}</ul>` : '<div class="small muted" style="margin-top:6px">No changes yet. Edit the items, discount or charges below.</div>'}
      <label class="check" style="margin-top:8px"><input type="checkbox" data-q="markChanges" ${q.markChanges ? 'checked' : ''}> Mark new and changed items on the printed quote, and list removed items</label></div>`;
  }
  if (vos.length) {
    const approvedVo = vos.filter(x => x.status === 'Approved').reduce((a, x) => a + totals(x).grand, 0);
    const base = totals(q).grand;
    html += `<div style="margin-top:14px"><b>Variation orders</b></div><div class="hlist">${vos.map(row).join('')}</div>
      <div class="contract"><span>Approved quotation</span><span>${fmt(base)}</span><span>Approved variations</span><span>${fmt(approvedVo)}</span><b>Contract value (inc. VAT)</b><b>AED ${fmt(base + approvedVo)}</b></div>`;
  }
  html += '</div>';
  box.innerHTML = html;
}

function bindEditor(v) {
  const q = EQ;
  v.oninput = e => {
    const el = e.target;
    if (el.dataset.q) {
      const k = el.dataset.q;
      if (el.type === 'checkbox') return;
      q[k] = el.dataset.num !== undefined ? (el.value === '' ? 0 : num(el.value)) : el.value;
      touch(q);
      if (k === 'project' || k === 'client') $('#ed-sub').textContent = (q.project || 'Untitled project') + (q.client ? ' · ' + q.client : '');
      if (k === 'markupPct') refreshPricing();
      if (k === 'discountValue') renderTotals();
    } else if (el.dataset.qLines) {
      q[el.dataset.qLines] = el.value.split('\n').map(s => s.trim()).filter(Boolean); touch(q);
    } else if (el.dataset.spec !== undefined) {
      q.spec[+el.dataset.spec][el.dataset.k] = el.value; touch(q);
    } else if (el.dataset.exf) {
      const row = el.closest('[data-ex]'); const x = q.extras.find(z => z.id === row.dataset.ex); if (!x) return;
      x[el.dataset.exf] = el.dataset.exf === 'desc' ? el.value : el.value; touch(q);
      const qty = x.auto ? extraQty(q, x) : num(x.qty);
      $('[data-ex-total]', row).textContent = fmt(qty * num(x.rate));
      renderTotals();
    }
  };
  v.onchange = e => {
    const el = e.target;
    if (el.dataset.q && el.type === 'checkbox') { q[el.dataset.q] = el.checked; touch(q); renderTotals(); }
    if (el.dataset.q === 'number') {
      // keep revisions and variation orders on the same base number
      const nb = q.number; S.quotes.forEach(x => { if (x.familyId === q.familyId || (x.type === 'variation' && x.parentFamilyId === q.familyId)) x.number = nb; });
      touch(q);
    }
    if (el.dataset.q === 'status' || el.dataset.q === 'number') { touch(q); $('#ed-title').innerHTML = headTitle(q); if (el.dataset.q === 'status') renderEditor(v, q.id); }
    if (el.dataset.secRename !== undefined) {
      const old = el.dataset.secRename; const nw = el.value.trim();
      if (nw !== old) {
        if (orderedSections(q).includes(nw)) { toast('A section with that name already exists', true); el.value = old; return; }
        q.sections = q.sections.map(s => s === old ? nw : s);
        q.items.forEach(it => { if (it.section === old) it.section = nw; });
        touch(q); renderItems();
      }
    }
    if (el.id === 'bulk-glass' && el.value) {
      const g = glassById(el.value);
      if (q.items.length && confirm(`Apply "${g.name}" to all ${q.items.length} items?`)) { q.items.forEach(it => it.glassId = g.id); touch(q); refreshPricing(); toast('Glass applied to all items'); }
      el.value = '';
    }
    if (el.id === 'add-extra' && el.value) {
      if (el.value === '__custom') q.extras.push({ id: uid(), extraId: null, desc: 'Additional charge', unit: 'lump', qty: 1, rate: 0, auto: false });
      else { const x = extraById(el.value); const auto = x.unit === 'area' || x.unit === 'item'; q.extras.push({ id: uid(), extraId: x.id, desc: x.name, unit: x.unit, qty: 1, rate: num(x.rate), auto }); }
      el.value = ''; touch(q); renderExtras(); renderTotals();
    }
  };
  $('#disc-type').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    q.discountType = b.dataset.t; $$('#disc-type button').forEach(x => x.classList.toggle('on', x === b)); touch(q); renderTotals();
  });
}

/* ---------- item modal ---------- */
let lastItemDefaults = {};
function productOptions(selectedId) {

    const ps = S.products.filter(p => p.category === cat && (p.active || p.id === selectedId));
    if (!ps.length) return '';
    return `<optgroup label="${esc(cat)}">${ps.map(p => `<option value="${esc(p.id)}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)}${num(p.rate) === 0 && !(p.bands || []).length ? ' (rate not set)' : ''}</option>`).join('')}</optgroup>`;
  }).join('');
}
function openItemModal(itemId, section) {
  const q = EQ;

  const firstProduct = S.products.find(p => p.active)?.id;
  const it = existing ? clone(existing) : {

    productId: lastItemDefaults.productId && productById(lastItemDefaults.productId) ? lastItemDefaults.productId : firstProduct,
    location: lastItemDefaults.location || '', width: '', height: '', qty: 1,
    glassId: lastItemDefaults.glassId || 'g-std', notes: '', desc: '', rateOverride: '',
  };
  const secs = orderedSections(q); if (!secs.includes(it.section)) secs.push(it.section);
  const body = `<form id="item-form" autocomplete="off">
    <div class="grid g4">
      <div class="field span2"><label>Product</label><select name="productId">${productOptions(it.productId)}</select></div>

      <div class="field"><label>Ref / mark</label><input type="text" name="marks" value="${esc(it.marks)}" placeholder="e.g. W-4, W-4.1"></div>

      <div class="field"><label>Floor / level</label><input type="text" name="location" list="loc-list" value="${esc(it.location)}" placeholder="GF / FF / RF (optional)"><datalist id="loc-list">${LOCATIONS.map(l => `<option value="${l}">`).join('')}</datalist></div>
      <div class="field span2"><label>Glass</label><select name="glassId"><option value="">— No glass —</option>${S.glass.map(g => `<option value="${esc(g.id)}" ${g.id === it.glassId ? 'selected' : ''}>${esc(g.name)}${num(g.rate) ? ` (+${fmt(g.rate)}/m² cost)` : ''}</option>`).join('')}</select></div>
      <div class="field span2"><label>Manual rate per item (AED)</label><input type="number" name="rateOverride" step="0.01" min="0" value="${esc(it.rateOverride)}" placeholder="Leave blank to use calculated rate"></div>
      <div class="field span2"><label>Description override</label><input type="text" name="desc" value="${esc(it.desc)}" placeholder="Leave blank to use product name"></div>
      <div class="field span2"><label>Notes (printed under the description)</label><textarea name="notes" rows="2" placeholder="e.g. Tilt & Turn: 600mmW x 2195mmH">${esc(it.notes)}</textarea></div>
    </div>

  </form>`;

  openModal({
    title: existing ? `Edit item ${it.marks || ''}` : `Add item${it.section ? ' — ' + it.section : ''}`, body, foot, wide: true,
    onMount: m => {
      const f = $('#item-form', m);
      f.dataset.id = it.id; f.dataset.existing = existing ? '1' : '';
      const upd = () => updateItemCalc(f);
      f.addEventListener('input', upd); f.addEventListener('change', upd);
      f.addEventListener('submit', e => { e.preventDefault(); saveItemForm(false); });
      f.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveItemForm(!existing); } });

function readItemForm(f) {
  const fd = new FormData(f); const o = {};
  for (const [k, v] of fd.entries()) o[k] = typeof v === 'string' ? v.trim() : v;
  ['width', 'height'].forEach(k => o[k] = o[k] === '' ? '' : num(o[k]));
  o.qty = o.qty === '' ? 1 : num(o.qty);

}
function updateItemCalc(f) {
  const it = readItemForm(f); const p = productById(it.productId);
  if (!p) return;
  $('#lbl-w').textContent = p.unit === 'lm' ? 'Length (mm)' : 'Width (mm)';
  $('#lbl-h').textContent = p.unit === 'lm' ? 'Height (mm, info)' : p.unit === 'unit' ? 'Height (mm, info)' : 'Height (mm)';
  const r = priceItem(EQ, it);
  const mLabel = p.unit === 'sqm' ? 'Area' : p.unit === 'lm' ? 'Length' : 'Measure';
  const mVal = p.unit === 'sqm' ? fmtQ(r.measure) + ' m²' : p.unit === 'lm' ? fmtQ(r.measure) + ' lm' : 'each';
  const bandNote = (p.bands || []).length && r.base !== num(p.rate) ? ` Width band rate used (cost ${fmt(r.base)} ${UNIT_SHORT[p.unit]}).` : '';
  const minNote = num(p.minQty) && p.unit !== 'unit' && r.measure === num(p.minQty) ? ` Minimum charge of ${p.minQty} ${UNIT_SHORT[p.unit]} applied.` : '';
  $('#item-calc').innerHTML = `
    <div><div class="k">${mLabel}</div><div class="v">${mVal}</div></div>
    <div><div class="k">Sell rate / ${UNIT_SHORT[p.unit]}</div><div class="v">${fmt(r.sellRate)}</div></div>
    <div><div class="k">Rate per item</div><div class="v">${fmt(r.unit)}${r.overridden ? ' <span class="tag ovr">MANUAL</span>' : ''}</div></div>
    <div><div class="k">Line total</div><div class="v">AED ${fmt(r.total)}</div></div>
    <div class="note">Cost ${fmt(r.base)} ${UNITS[p.unit]} + ${fmt(num(EQ.markupPct))}% markup${r.glassSellRate ? ` · glass upgrade +${fmt(r.glassSellRate)}/m² sell` : ''}.${bandNote}${minNote}${r.overridden ? ` Calculated rate would be ${fmt(r.computedUnit)}.` : ''}${r.zero ? ' <b style="color:var(--amber)">This product has no rate set yet.</b>' : ''}</div>`;
}
function saveItemForm(addAnother) {
  const f = $('#item-form'); if (!f) return;
  const it = readItemForm(f); const p = productById(it.productId);
  if (!p) return toast('Choose a product', true);
  if (p.unit === 'sqm' && (!it.width || !it.height)) return toast('Enter width and height', true);
  if (p.unit === 'lm' && !it.width) return toast('Enter the length', true);
  if (!(it.qty > 0)) return toast('Quantity must be at least 1', true);
  const q = EQ;
  const existing = q.items.find(i => i.id === it.id);
  if (existing) Object.assign(existing, it); else q.items.push(it);
  if (it.section && !q.sections.includes(it.section)) q.sections.push(it.section);
  lastItemDefaults = { productId: it.productId, location: it.location, glassId: it.glassId };
  touch(q); refreshPricing();
  if (addAnother) { toast('Item added'); openItemModal(null, it.section); }
  else { closeModal(); toast(existing ? 'Item updated' : 'Item added'); }
}

function buildDoc(q) {

      ${isVO && parent ? (() => { const base = totals(parent).grand; const others = variationsOf(parent).filter(x => x.familyId !== q.familyId && x.status === 'Approved' && x.vo < q.vo).reduce((a, x) => a + totals(x).grand, 0); return `<div class="bar"><span>VARIATION SUMMARY</span><i></i></div>

/* ============================================================
   NEW QUOTE FROM PDF (drawing or BOQ)
   PDFs are read on this device with pdf.js; nothing is uploaded.
   ============================================================ */
/* ============================================================
   PDF READER — turns positioned PDF text into quote rows.
   Input: pages = [{ W, H, items: [{ s, x, y, w, h }] }]  (y grows downward)
   Works on PDFs that contain real text (CAD/Excel/Word exports).
   Scanned images have no text and return a warning.
   ============================================================ */
const PdfReader = (() => {
  const MARK_RE = /^[A-Z]{1,4}[- ]?\d{1,3}(?:\.\d{1,2})?[A-Za-z]?,?$/;
  const DIM_TAG_RE = /^([HW])\s*=\s*(\d{3,5})$/i;
  const SIZE_RE = /(\d{3,5})\s*(?:mm)?\s*(?:w)?\s*[x×X*]\s*(\d{3,5})\s*(?:mm)?/;
  const NUM_RE = /^-?\d{1,3}(?:,\d{3})*(?:\.\d+)?$|^-?\d+(?:\.\d+)?$/;
  const COLS = [
    ['ref', /^(ref\.?(\s*no\.?)?|item(\s*no\.?)?|no\.?|s\.?\s*no\.?|sr\.?|mark|type|code|tag|id)$/i],
    ['desc', /^(description|name|item description|specification|details|particulars|window type|door type)$/i],
    ['width', /^(width|w|wd|width\s*\(mm\)|w\s*\(mm\))$/i],
    ['height', /^(height|h|ht|height\s*\(mm\)|h\s*\(mm\))$/i],
    ['qty', /^(qty\.?|quantity|nos\.?|no\. of units|count|units)$/i],
    ['unit', /^(unit|uom|u\/m)$/i],
    ['rate', /^(rate|unit rate|rate\s*\(aed\)|unit price|price)$/i],
    ['amount', /^(total|amount|total\s*\(aed\)|amount\s*\(aed\)|total price)$/i],
    ['location', /^(location|floor|level|room|area)$/i],
  ];
  const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
  const toNum = s => { const n = parseFloat(String(s).replace(/,/g, '')); return isFinite(n) ? n : null; };
  const normMark = s => clean(s).replace(/,$/, '').replace(/\s+/, '-').toUpperCase();
  const baseMark = m => m.replace(/\.\d+$/, '');
  const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase());

  function lines(items, tol = 3) {
    const its = items.filter(i => clean(i.s)).slice().sort((a, b) => a.y - b.y || a.x - b.x);
    const out = []; let cur = null;
    for (const it of its) {
      if (!cur || Math.abs(it.y - cur.y) > tol) { cur = { y: it.y, items: [] }; out.push(cur); }
      cur.items.push(it);
    }
    out.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => clean(i.s)).join(' '); });
    return out;
  }
  const colOf = s => { const t = clean(s).replace(/[:]/g, ''); for (const [k, re] of COLS) if (re.test(t)) return k; return null; };

  /* ---------- table detection (BOQs and window/door schedules) ---------- */
  function findHeaders(page) {
    const ls = lines(page.items);
    const found = [];
    ls.forEach((l, li) => {
      const cols = {};
      // header cells may be split over neighbouring lines (e.g. "WIDTH" above "(mm)")
      const near = ls.filter(o => Math.abs(o.y - l.y) <= 9);
      near.forEach(o => o.items.forEach(it => {
        const k = colOf(it.s); if (k && !cols[k]) cols[k] = { x: it.x + it.w / 2, left: it.x, y: it.y };
      }));
      const keys = Object.keys(cols);
      const hasMeasure = cols.width || cols.height || cols.qty;
      if (keys.length >= 3 && hasMeasure && (cols.ref || cols.desc)) {
        const y = Math.max(...near.map(o => o.y));
        if (!found.some(f => Math.abs(f.y - y) < 12 && Math.abs(f.cols[keys[0]].x - cols[keys[0]].x) < 50)) found.push({ y, cols, top: Math.min(...near.map(o => o.y)) });
      }
    });
    return found;
  }
  function assignCol(it, cols, bounds) {
    const cx = it.x + it.w / 2; const s = clean(it.s);
    const nearest = keys => { let best = null, bd = Infinity; keys.forEach(k => { if (!cols[k]) return; const d = Math.abs(cx - cols[k].x); if (d < bd) { bd = d; best = k; } }); return best; };
    const all = Object.keys(cols);
    if (MARK_RE.test(s) && cols.ref && cx < bounds.descRight) return cols.desc && cx > cols.desc.x + 40 ? 'desc' : 'ref';
    if (NUM_RE.test(s)) return nearest(all);
    // words: description if it sits left of the numeric columns
    if (cols.desc && cx <= bounds.descRight) return (cols.ref && cx < cols.ref.x + 12 && it.w < 40) ? 'ref' : 'desc';
    return nearest(all.filter(k => !['width', 'height', 'qty', 'rate', 'amount'].includes(k))) || nearest(all);
  }
  function parseTable(page, hdr, nextTop) {
    const cols = hdr.cols; const keys = Object.keys(cols).sort((a, b) => cols[a].x - cols[b].x);
    const xs = keys.map(k => cols[k].x);
    const minX = Math.min(...keys.map(k => cols[k].left)) - 60, maxX = Math.max(...xs) + 90;
    const di = keys.indexOf('desc');
    const bounds = { descLeft: di >= 0 ? (di > 0 ? (xs[di - 1] + cols.desc.left) / 2 : minX) : 0, descRight: di >= 0 && di < keys.length - 1 ? (cols.desc.x + xs[di + 1]) / 2 : maxX };
    const items = page.items.filter(i => i.y > hdr.y + 2 && i.y < nextTop && i.x + i.w / 2 >= minX && i.x <= maxX);
    const ls = lines(items);
    const anchorCol = cols.qty ? 'qty' : (cols.ref ? 'ref' : 'width');
    const rows = []; const sections = [];
    let stopY = Infinity;
    ls.forEach(l => {
      if (/\b(grand total|sub-?total|total\s*\(ex|vat\s*\(|carried forward|total amount)\b/i.test(l.text) && l.y < stopY) stopY = l.y;
    });
    const cells = ls.filter(l => l.y < stopY).map(l => {
      const c = {}; l.items.forEach(it => { const k = assignCol(it, cols, bounds); (c[k] = c[k] || []).push(clean(it.s)); });
      return { y: l.y, c, text: l.text };
    });
    cells.forEach(l => {
      const a = l.c[anchorCol];
      let ok = false;
      if (anchorCol === 'qty') ok = a && a.some(v => NUM_RE.test(v) && toNum(v) > 0 && toNum(v) < 100000);
      else if (anchorCol === 'ref') ok = a && a.some(v => MARK_RE.test(v) || /^\d+(\.\d+)*$/.test(v)) && (l.c.width || l.c.height || l.c.desc);
      else ok = a && a.some(v => NUM_RE.test(v));
      if (ok) rows.push({ y: l.y, lines: [] });
      const words = l.text.split(' ');
      if (!ok && !/\d/.test(l.text) && l.text === l.text.toUpperCase() && /[A-Z]{3}/.test(l.text) && words.length <= 6 && !colOf(l.text) && Object.keys(l.c).length <= 2)
        sections.push({ y: l.y, name: titleCase(l.text) });
    });

    // a table ends where the row spacing suddenly jumps (e.g. title block below a schedule)

  renderImpLevels(); renderImpMap(); renderImpRows();
  v.oninput = e => {
    const el = e.target;
    if (el.id === 'imp-project') IMP.project = el.value;
    if (el.id === 'imp-client') IMP.client = el.value;
    if (el.dataset.secname !== undefined) { const orig = el.dataset.secname; IMP.secNames[orig] = el.value.trim(); IMP.rows.forEach(x => { if (x.origSection === orig) x.section = el.value.trim(); }); }
    const rowEl = el.closest('[data-row]');
    if (rowEl && el.dataset.f) { const row = IMP.rows.find(x => x.id === rowEl.dataset.row); row[el.dataset.f] = ['qty', 'width', 'height'].includes(el.dataset.f) ? (el.value === '' ? '' : num(el.value)) : el.value; if (el.dataset.f === 'qty') impCount(); }
  };
  v.onchange = e => {
    const el = e.target;
    if (el.id === 'imp-user') IMP.preparedBy = el.value;
    if (el.dataset.secname !== undefined) renderImpRows();
    const rowEl = el.closest('[data-row]');
    if (rowEl && el.dataset.f === 'include') { IMP.rows.find(x => x.id === rowEl.dataset.row).include = el.checked; rowEl.classList.toggle('off', !el.checked); impCount(); renderImpMap(); }
    if (rowEl && el.dataset.f === 'productId') { const row = IMP.rows.find(x => x.id === rowEl.dataset.row); row.productId = el.value; row.manualProduct = true; }
    if (el.dataset.band) {
      const [ei, bi] = el.dataset.band.split('|').map(Number);
      r.elevations[ei].bands[bi].label = el.value;
      r.rows = PdfReader.drawingRows(r); IMP.rows = prepareRows(r.rows); renderImpMap(); renderImpRows();
    }
    if (el.dataset.src !== undefined) {
      const src = el.dataset.src; IMP.map[src] = el.value;
      if (el.value) S.settings.importMap[normTxt(src)] = el.value; else delete S.settings.importMap[normTxt(src)];
      save();
      IMP.rows.forEach(row => { if (row.source === src && !row.manualProduct) row.productId = el.value || autoMatch(row); });
      renderImpRows();
    }
  };
}
function renderImpLevels() {
  const box = $('#imp-levels'); const r = IMP.res; if (!box) return;
  if (r.kind !== 'drawing' || !r.elevations?.length) { box.innerHTML = ''; return; }
  const opts = ['GF', 'FF', 'SF', 'TF', 'RF', 'Basement', 'Mezzanine'];
  box.innerHTML = `<div class="card"><div class="card-h"><h2>Floor levels</h2><span class="hint">Each row of tags on an elevation was treated as one level. Set the right floor for each row; the items update automatically.</span></div>
    <div class="lvl-grid">${r.elevations.map((e, ei) => `<div class="lvl"><div class="lvl-h"><b>${esc(e.title)}</b><span class="small muted">page ${e.page}</span></div>
      ${e.bands.map((b, bi) => `<div class="lvl-row"><span class="lvl-n">${bi === 0 ? 'Top' : bi === e.bands.length - 1 ? 'Bottom' : 'Row ' + (bi + 1)}</span>
        <span class="lvl-marks">${Object.entries(b.marks).map(([m, n]) => `${esc(m)}${n > 1 ? ' ×' + n : ''}`).join(', ')}</span>
        <select class="sm" data-band="${ei}|${bi}">${[...new Set([...opts, b.label])].map(o => `<option ${o === b.label ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}
    </div>`).join('')}</div></div>`;
}
function renderImpMap() {
  const box = $('#imp-map'); if (!box) return;
  const groups = {}; IMP.rows.filter(x => x.include).forEach(x => { const k = x.source || '(no description)'; groups[k] = groups[k] || { n: 0, lines: 0 }; groups[k].n += num(x.qty); groups[k].lines++; });
  const keys = Object.keys(groups);
  if (!keys.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="card"><div class="card-h"><h2>Match to your products</h2><span class="hint">Choose a product for each description in the document. “Auto” picks by type and size. Your choices are remembered for next time.</span></div>
    ${keys.map(k => `<div class="map-row"><div><b>${esc(k)}</b><div class="small muted">${groups[k].lines} line${groups[k].lines === 1 ? '' : 's'} · ${fmtQ(groups[k].n)} unit${groups[k].n === 1 ? '' : 's'}</div></div>
      <select class="sm" data-src="${esc(k)}"><option value="">Auto (by type &amp; size)</option>${productOptions(IMP.map[k] || S.settings.importMap[normTxt(k)] || '')}</select></div>`).join('')}</div>`;
}
function renderImpRows() {
  const box = $('#imp-rows'); if (!box) return;
  const secs = []; IMP.rows.forEach(x => { if (!secs.includes(x.origSection)) secs.push(x.origSection); });
  box.innerHTML = `<div class="imp-row head"><div></div><div>Ref</div><div>From document</div><div>Product</div><div>Floor</div><div>W (mm)</div><div>H (mm)</div><div>Qty</div></div>` +
    secs.map(sec => (() => { const cur = IMP.rows.find(x => x.origSection === sec).section; return `<div class="imp-sec"><span class="lbl">Location or Description</span>
      <input type="text" class="sm" data-secname="${esc(sec)}" value="${esc(cur)}" placeholder="No heading. Type one if needed" aria-label="Location or Description">
      ${sec && cur !== sec ? `<button class="btn ghost sm" data-act="resetSecName" data-sec="${esc(sec)}" title="Use the name from the document">↺ ${esc(sec)}</button>` : sec ? '<span class="small muted">from document</span>' : ''}</div>`; })() + IMP.rows.filter(x => x.origSection === sec).map(x => `
    <div class="imp-row ${x.include ? '' : 'off'}" data-row="${esc(x.id)}">
      <div><input type="checkbox" data-f="include" ${x.include ? 'checked' : ''} aria-label="Include"></div>
      <div><input type="text" class="sm" data-f="marks" value="${esc(x.marks)}"></div>
      <div class="src"><span title="${esc(x.source)}">${esc(x.source || '—')}</span>${x.notes ? `<div class="small muted">${esc(x.notes.split('\n').join(' / '))}</div>` : ''}${x.flag ? `<div class="flag">⚠ ${esc(x.flag)}</div>` : ''}</div>
      <div><select class="sm" data-f="productId">${x.productId ? '' : '<option value="">— choose —</option>'}${productOptions(x.productId)}</select></div>
      <div><input type="text" class="sm" data-f="location" list="loc-list-imp" value="${esc(x.location)}" placeholder="Floor" aria-label="Floor / level"></div>
      <div><input type="number" class="sm" data-f="width" value="${esc(x.width)}" placeholder="W" aria-label="Width"></div>
      <div><input type="number" class="sm" data-f="height" value="${esc(x.height)}" placeholder="H" aria-label="Height"></div>
      <div><input type="number" class="sm" data-f="qty" min="0" value="${esc(x.qty)}" placeholder="Qty" aria-label="Quantity"></div>
    </div>`).join('')).join('') + `<datalist id="loc-list-imp">${LOCATIONS.map(l => `<option value="${l}">`).join('')}</datalist>`;
  impCount();
}
function impCount() {
  const inc = IMP.rows.filter(x => x.include);
  const el = $('#imp-count'); if (el) el.innerHTML = `<b>${inc.length}</b> line${inc.length === 1 ? '' : 's'} · <b>${fmtQ(inc.reduce((a, x) => a + num(x.qty), 0))}</b> units selected`;
}
function createFromImport() {
  const inc = IMP.rows.filter(x => x.include && num(x.qty) > 0);
  if (!inc.length) return toast('Tick at least one item', true);
  const missing = inc.filter(x => !x.productId);
  if (missing.length) return toast(`Choose a product for ${missing.length} line${missing.length === 1 ? '' : 's'} (${missing[0].marks || missing[0].source})`, true);
  const q = newQuote();
  const secs = [];
  inc.forEach(x => {
    const sec = x.section || ''; if (!secs.includes(sec)) secs.push(sec);
    q.items.push({ id: uid(), section: sec, marks: x.marks, productId: x.productId, location: x.location || '', width: x.width === '' ? '' : num(x.width), height: x.height === '' ? '' : num(x.height), qty: num(x.qty), glassId: 'g-std', notes: x.notes || '', desc: '', rateOverride: '', importedDesc: x.source });
  });
  Object.assign(q, { sections: secs, project: IMP.project, client: IMP.client, preparedBy: IMP.preparedBy,
    source: { files: IMP.files, kind: IMP.res.kind, date: todayISO() },
    internalNotes: `Created from ${IMP.files.join(', ')} on ${dateShort(todayISO())}. Check quantities and sizes against the documents.` });
  S.quotes.push(q); saveNow(); IMP = null; toast(`${displayNo(q)} created with ${q.items.length} lines`); go('#/quote/' + q.id);
}

/* ============================================================
   ACTIONS (event delegation)
   ============================================================ */
const ACTIONS = {
  closeModal: () => closeModal(),
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#install-btn').classList.add('hidden'); },
  newQuote: () => {
    openModal({ title: 'New quote', body: `<div class="choose">
        <button class="choice" data-act="newBlank"><span class="ic">✎</span><b>Start from scratch</b><span>An empty quote with the standard sections. Add items yourself.</span></button>
        <label class="choice"><input type="file" accept="application/pdf,.pdf" id="pdf-input" multiple hidden><span class="ic">⇪</span><b>Upload drawing or BOQ</b><span>PDF drawings with a window/door schedule, or a bill of quantities. You check everything before the quote is made.</span></label>
      </div><div class="small muted" style="margin-top:12px">PDFs are read on this device and are not uploaded anywhere. Scanned PDFs (pictures with no text) can't be read.</div>`,
      onMount: m => $('#pdf-input', m).addEventListener('change', e => { const f = e.target.files; closeModal(); startImport(f); }) });
  },
  newBlank: () => { closeModal(); IMP = null; const q = newQuote(); S.quotes.push(q); saveNow(); go('#/quote/' + q.id); },
  cancelImport: () => { IMP = null; go('#/quotes'); },
  resetSecName: (el) => { const orig = el.dataset.sec; delete IMP.secNames[orig]; IMP.rows.forEach(x => { if (x.origSection === orig) x.section = orig; }); renderImpRows(); },
  createFromImport: () => createFromImport(),
  newRevision: (el) => {
    const src = quoteById(el.dataset.id); if (!src) return;
    const latest = latestOf(src); if (latest.id !== src.id) return go('#/quote/' + latest.id);
    if (src.status === 'Draft' && !confirm(`${displayNo(src)} is still a draft, so you can simply edit it. Create revision R${src.rev + 1} anyway?`)) return;
    if (src.status !== 'Draft' && !confirm(`Create revision R${src.rev + 1} of ${displayNo(src)}? The current version will be kept read-only for reference.`)) return;
    const q = clone(src);
    Object.assign(q, { id: uid(), rev: src.rev + 1, status: 'Draft', date: todayISO(), preparedBy: currentUserId(), revNote: '', markChanges: true, createdAt: Date.now(), updatedAt: Date.now() });
    q.items.forEach(i => i.id = uid()); q.extras.forEach(x => x.id = uid());
    src.prevStatus = src.status; src.status = 'Revised';
    S.quotes.push(q); saveNow(); toast(`Created ${displayNo(q)}. Make the customer's changes, then send it`); go('#/quote/' + q.id);
  },
  newVariation: (el) => {
    const src = quoteById(el.dataset.id); if (!src) return;
    const st = S.settings;
    const vo = S.quotes.filter(x => x.type === 'variation' && x.parentFamilyId === src.familyId).reduce((a, x) => Math.max(a, x.vo), 0) + 1;
    const q = newQuote({}, false);
    Object.assign(q, { type: 'variation', vo, rev: 0, familyId: q.id, parentFamilyId: src.familyId, number: src.number,
      project: src.project, client: src.client, clientContact: src.clientContact, boqTitle: src.boqTitle,
      markupPct: src.markupPct, sections: src.sections.slice(), exclusions: src.exclusions.slice(), spec: clone(src.spec),
      letter: st.voLetter || DEFAULT_VO_LETTER, confirmation: st.voConfirmation || DEFAULT_VO_CONFIRM, showCover: false, showTerms: true });
    S.quotes.push(q); saveNow(); toast(`Variation order ${displayNo(q)} created`); go('#/quote/' + q.id);
  },
  dupQuote: (el) => {
    const src = quoteById(el.dataset.id); if (!src) return;
    const q = newQuote(); const keep = { id: q.id, number: q.number, date: q.date, status: 'Draft', createdAt: q.createdAt, updatedAt: q.updatedAt, preparedBy: currentUserId(), type: 'quote', rev: 0, vo: 0, familyId: q.id, parentFamilyId: null, revNote: '' };
    Object.assign(q, clone(src), keep); q.items.forEach(i => i.id = uid()); q.extras.forEach(x => x.id = uid());
    if (src.type === 'variation') { q.letter = S.settings.letter; q.confirmation = S.settings.confirmation; q.showCover = true; }
    S.quotes.push(q); saveNow(); toast(`Copied to ${q.number}`); go('#/quote/' + q.id);
  },
  delQuote: (el) => {
    const q = quoteById(el.dataset.id); if (!q) return;
    const fam = familyOf(q); const vos = q.type === 'quote' ? S.quotes.filter(x => x.type === 'variation' && x.parentFamilyId === q.familyId) : [];
    const msg = fam.length > 1 ? `Delete ${displayNo(q)} only? Earlier revisions are kept (the previous one becomes editable again).`
      : `Delete ${displayNo(q)} (${q.project || 'untitled'})?${vos.length ? ` Its ${vos.length} variation order${vos.length === 1 ? '' : 's'} will be deleted too.` : ''} This cannot be undone.`;
    if (!confirm(msg)) return;
    S.quotes = S.quotes.filter(x => x !== q && !(fam.length === 1 && vos.includes(x)));
    const prev = fam.filter(x => x !== q).pop();
    if (prev && prev.status === 'Revised' && !fam.some(x => x !== q && x.rev > prev.rev)) prev.status = prev.prevStatus || 'Sent';
    saveNow(); toast('Deleted'); go(prev ? '#/quote/' + prev.id : '#/quotes');
  },
  previewQuote: (el) => go('#/preview/' + el.dataset.id),
  print: () => printQuote(),
  addSection: () => {
    const inp = $('#new-sec'); const name = inp.value.trim(); if (!name) return inp.focus();
    if (orderedSections(EQ).includes(name)) return toast('That section already exists', true);
    EQ.sections.push(name); inp.value = ''; touch(EQ); renderItems();
  },
  secUp: (el) => moveSection(el.dataset.sec, -1),
  secDown: (el) => moveSection(el.dataset.sec, 1),
  secDel: (el) => {
    const sec = el.dataset.sec; const n = EQ.items.filter(i => i.section === sec).length;
    if (n && !confirm(`Remove section "${sec}" and its ${n} item${n === 1 ? '' : 's'}?`)) return;
    EQ.sections = EQ.sections.filter(s => s !== sec); EQ.items = EQ.items.filter(i => i.section !== sec); touch(EQ); refreshPricing();
  },
  addItem: (el) => openItemModal(null, el.dataset.sec),
  editItem: (el) => openItemModal(el.dataset.id),
  dupItem: (el) => {
    const i = EQ.items.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const c = clone(EQ.items[i]); c.id = uid(); EQ.items.splice(i + 1, 0, c); touch(EQ); refreshPricing(); toast('Item duplicated');
  },
  delItem: (el) => {
    const it = EQ.items.find(x => x.id === el.dataset.id); if (!it) return;
    if (!confirm(`Delete item ${it.marks || ''}?`)) return;
    EQ.items = EQ.items.filter(x => x !== it); touch(EQ); refreshPricing();
  },
  itemUp: (el) => moveItem(el.dataset.id, -1),
  itemDown: (el) => moveItem(el.dataset.id, 1),
  itemSave: () => saveItemForm(false),
  itemSaveNext: () => saveItemForm(true),
  delExtra: (el) => { EQ.extras = EQ.extras.filter(x => x.id !== el.dataset.id); touch(EQ); renderExtras(); renderTotals(); },
  addSpec: () => { EQ.spec.push({ label: '', value: '' }); touch(EQ); renderSpec(); },
  delSpec: (el) => { EQ.spec.splice(+el.dataset.i, 1); touch(EQ); renderSpec(); },
  resetTerms: () => {
    if (!confirm('Replace this quote’s cover letter, exclusions and terms with the defaults from Settings?')) return;
    const st = S.settings; Object.assign(EQ, { letter: st.letter, exclusions: st.exclusions.slice(), spec: clone(st.spec), confirmation: st.confirmation });
    touch(EQ); renderEditor($('#view'), EQ.id);
  },
  newProduct: () => openProductModal(null),
  editProduct: (el) => openProductModal(el.dataset.id),
  saveProduct: () => saveProductForm(),
  delProduct: (el) => {
    const p = productById(el.dataset.id); const used = S.quotes.filter(q => q.items.some(i => i.productId === p.id)).length;
    if (used) { if (!confirm(`"${p.name}" is used in ${used} quote${used === 1 ? '' : 's'}. Deactivate it instead of deleting?`)) return; p.active = false; save(); return renderProducts($('#view')); }
    if (!confirm(`Delete "${p.name}"?`)) return;
    S.products = S.products.filter(x => x !== p); save(); renderProducts($('#view'));
  },
  newGlass: () => { S.glass.push({ id: 'g-' + uid(), name: 'New glass option', rate: 0 }); save(); renderProducts($('#view')); },
  delGlass: (el) => { if (!confirm('Delete this glass option? Items using it will fall back to no upgrade.')) return; S.glass = S.glass.filter(g => g.id !== el.dataset.id); save(); renderProducts($('#view')); },
  newExtra: () => { S.extras.push({ id: 'x-' + uid(), name: 'New charge', unit: 'lump', rate: 0 }); save(); renderProducts($('#view')); },
  delExtraType: (el) => { if (!confirm('Delete this charge type? Quotes that already use it keep their line.')) return; S.extras = S.extras.filter(x => x.id !== el.dataset.id); save(); renderProducts($('#view')); },
  addUser: () => { S.settings.users.push({ id: 'u-' + uid(), name: '', phone: '', email: '' }); save(); renderSettings($('#view')); renderUserPicker(); },
  delUser: (el) => { if (!confirm('Remove this team member?')) return; S.settings.users = S.settings.users.filter(u => u.id !== el.dataset.id); save(); renderSettings($('#view')); renderUserPicker(); },
  addSetSpec: () => { S.settings.spec.push({ label: '', value: '' }); save(); renderSettings($('#view')); },
  delSetSpec: (el) => { S.settings.spec.splice(+el.dataset.i, 1); save(); renderSettings($('#view')); },
  clearImportMap: () => { S.settings.importMap = {}; save(); renderSettings($('#view')); toast('Remembered matches cleared'); },
  resetImg: (el) => { S.settings[el.dataset.k] = null; saveNow(); render(); },
  exportData: () => { saveNow(); download(`eurolux-quotes-backup-${todayISO()}.json`, JSON.stringify(S, null, 2)); },
  loadDemo: () => {
    S.quotes = S.quotes.filter(q => q.id !== 'demo-q26344'); S.quotes.push(demoQuote(S.settings));
    // make sure the demo's products exist
    seedProducts().forEach(p => { if (!productById(p.id)) S.products.push(p); });
    saveNow(); toast('Demo quote loaded'); go('#/quote/demo-q26344');
  },
  resetAll: () => {
    if (!confirm('Delete ALL quotes, products and settings on this device and start again? Download a backup first if unsure.')) return;
    S = freshState(); saveNow(); go('#/quotes');
  },
};
function moveSection(sec, dir) {
  const secs = orderedSections(EQ); const i = secs.indexOf(sec); const j = i + dir;
  if (i < 0 || j < 0 || j >= secs.length) return;
  [secs[i], secs[j]] = [secs[j], secs[i]]; EQ.sections = secs; touch(EQ); renderItems();
}
function moveItem(id, dir) {
  const arr = EQ.items; const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  let j = i + dir;
  while (j >= 0 && j < arr.length && arr[j].section !== arr[i].section) j += dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; touch(EQ); renderItems();
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); e.stopPropagation(); ACTIONS[a.dataset.act](a, e); return; }
  if (e.target.matches('[data-overlay]')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
$('#current-user').addEventListener('change', e => { Store.setPref(USER_KEY, e.target.value); toast('Estimator: ' + (userById(e.target.value)?.name || '')); });
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', () => saveNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

/* ---------- PWA ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#install-btn').classList.remove('hidden'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err)));
}

/* ---------- boot ---------- */
S = migrate(Store.load() || freshState());
saveNow();
render();
</script>
</body>
